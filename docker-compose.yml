#A blueprint that defines multiple containers (services) and how they work together.

services:
  db:
    image: mysql:8.0
    container_name: nails_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: PC-MySQL_PassPass02
      MYSQL_DATABASE: nailsbar_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: . #build docker image from dockerfile in the curent fold
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
      